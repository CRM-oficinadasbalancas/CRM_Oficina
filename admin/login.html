<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CRM Oficina das Balanças</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/tema-oficina.css">
</head>
<body class="admin-body login-page">

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark">
      <img src="../assets/img/logo-oficina.webp" alt="Oficina das Balanças">
    </div>
    <h1>Portal Administrativo</h1>

    <form id="login-form">
      <div class="form-field" style="margin-bottom:14px;">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-field" style="margin-bottom:20px;">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="error-message" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('login-error');
    var btn = document.getElementById('login-btn');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    var { error } = await supabaseClient.auth.signInWithPassword({
      email: usernameToEmail(username),
      password: password
    });

    if (error) {
      errorEl.textContent = 'Usuário ou senha inválidos.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    location.href = 'dashboard.html';
  });
</script>
</body>
</html>
